# p20 사주 결제 워커 설정 — 배포는 neo 승인 후에만.
#
# ⚠️ p1(legion-pay)과 **완전히 분리된 워커 + 분리된 KV**를 쓴다.
#    같은 KV를 공유하면 p1 영수증과 p20 크레딧이 같은 네임스페이스에서 섞이고,
#    한쪽 정리·롤백이 다른 쪽을 깨뜨린다. 매출 분리 관측도 불가능해진다.
#
# ── neo 실행 순서 (이 파일 기준) ────────────────────────────────────────────────
#   1. KV 생성:  wrangler kv namespace create RECEIPTS --config wrangler-pay.toml
#      → 출력된 id를 아래 [[kv_namespaces]] id 자리에 붙여넣는다 (id는 시크릿이 아니라 커밋 가능).
#   2. 시크릿 주입 (셋 다 필수. 코드·깃에 절대 넣지 않는다):
#      wrangler secret put BOT_TOKEN       --config wrangler-pay.toml   # @BotFather 발급 토큰
#      wrangler secret put WEBHOOK_SECRET  --config wrangler-pay.toml   # 아무 랜덤 문자열(직접 생성)
#      wrangler secret put ADMIN_SECRET    --config wrangler-pay.toml   # 환불 라우트 보호용 랜덤 문자열
#   3. 배포:      wrangler deploy --config wrangler-pay.toml
#   4. 웹훅 등록: setWebhook 에 url=<워커주소>/webhook, secret_token=<WEBHOOK_SECRET 과 동일값>
#   5. 프론트 saju-pay.js 의 PAY_BACKEND 에 배포된 워커 주소를 넣는다.
#
# 킬스위치: Cloudflare 대시보드에서 워커 비활성화 또는 `wrangler delete`.
#           프론트는 PAY_BACKEND 응답이 없으면 결제 버튼을 잠글 뿐, 무료 지급으로 넘어가지 않는다.

name = "saju-pay"
main = "pay-worker.js"
compatibility_date = "2025-01-01"

[vars]
APP_URL = "https://hosuman08-netizen.github.io/saju-miniapp/"
# 복귀유도 실발송 스위치. "true"로 바꾸기 전까진 scheduled()가 dry-run만 함.
# 킬스위치 겸용: 문제 생기면 이 값만 "false"로 되돌리고 재배포.
SCHEDULE_SEND_ENABLED = "false"

# 크레딧 원장 전용 KV. p1의 RECEIPTS(c1576c19...)를 재사용하지 말 것.
[[kv_namespaces]]
binding = "RECEIPTS"
id = "ed0474f27e0840598145f00e6446c79b"

# 복귀유도 발송 크론 — 하루 1회. 배포돼도 SCHEDULE_SEND_ENABLED=false면 무동작(dry-run).
[triggers]
crons = ["0 3 * * *"]
